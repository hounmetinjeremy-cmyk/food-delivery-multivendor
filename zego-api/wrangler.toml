name = "zego-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "zego-db"
database_id = "9b905d94-509e-4597-a4ca-dda69cf7f49f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "zego-uploads"

[vars]
# Non-secret defaults for local dev. Override real values with:
#   wrangler secret put JWT_SECRET
ENVIRONMENT = "development"
# Google OAuth client IDs allowed to sign in (comma-separated: web, iOS, Android
# client IDs all share one Google Sign-In flow). Not secret — safe as a var.
GOOGLE_CLIENT_IDS = "545417768480-qp2qi2psh0862m67oqsj1ules76jhqsf.apps.googleusercontent.com,545417768480-4l1rmpk3iq7jcsga2bi8jk0o6d1uqq6p.apps.googleusercontent.com"
